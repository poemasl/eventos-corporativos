  <style>
    /* ── HERO: subir encuadre para mostrar más el centro y menos techo ── */
    .hero-bg { object-position: center 35%; }
    /* Tagline en una sola línea en ordenador */
    @media (min-width: 768px) {
      .hero-tagline { max-width: none; white-space: nowrap; }
    }

    /* ── USOS ── */
    .usos { padding: 120px 32px; background: var(--black); }
    .usos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 48px;
    }
    .uso-item {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 4/3;
    }
    .uso-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.82) saturate(0.95);
      transition: transform 0.6s ease, filter 0.6s ease;
      display: block;
    }
    .uso-item:hover img {
      transform: scale(1.05);
      filter: brightness(0.92) saturate(1);
    }
    .uso-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }
    .uso-item h3 {
      position: absolute;
      left: 20px;
      bottom: 20px;
      right: 60px;
      z-index: 2;
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--white);
      margin: 0;
      line-height: 1.25;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }
    .uso-info-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 3;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      color: var(--gold);
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, color 0.25s;
    }
    .uso-info-btn:hover,
    .uso-item.open .uso-info-btn {
      background: var(--gold);
      color: var(--black);
    }
    .uso-panel {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(3px);
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .uso-item.open .uso-panel {
      opacity: 1;
      visibility: visible;
    }
    .uso-panel { cursor: pointer; flex-direction: column; gap: 14px; }
    .uso-panel p {
      font-size: 0.9rem;
      color: var(--white);
      line-height: 1.8;
      margin: 0;
    }
    .uso-panel .uso-close {
      font-family: var(--font-sans);
      font-size: 1.4rem;
      line-height: 1;
      color: var(--gold);
    }

    /* ── FORMATOS / CONFIGURACIONES ── */
    .formatos { padding: 120px 32px; background: var(--dark); }
    .formatos-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 48px;
    }
    .formato-item {
      background: rgba(201,168,76,0.05);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 8px;
      padding: 28px 30px;
    }
    .formato-item h3 {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 400;
      color: var(--gold-light);
      margin-bottom: 8px;
    }
    .formato-item p {
      font-size: 0.88rem;
      color: var(--white-dim);
      line-height: 1.8;
    }

    /* ── EQUIPAMIENTO ── */
    .equip { padding: 120px 32px; background: var(--black); }
    .equip-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
      margin-top: 48px;
    }
    .equip-item { text-align: center; }
    .equip-img-wrap {
      overflow: hidden;
      border-radius: 8px;
      aspect-ratio: 4/3;
      margin-bottom: 16px;
    }
    .equip-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.9) saturate(0.9);
      transition: transform 0.6s ease, filter 0.6s ease;
      display: block;
    }
    .equip-item:hover .equip-img-wrap img {
      transform: scale(1.05);
      filter: brightness(1) saturate(1);
    }
    .equip-item h3 {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--white);
      margin-bottom: 6px;
    }
    .equip-item p {
      font-size: 0.8rem;
      color: var(--white-dim);
      line-height: 1.7;
    }

    @media (max-width: 900px) {
      .usos-grid { grid-template-columns: 1fr 1fr; gap: 32px; }
      .formatos-grid { grid-template-columns: 1fr; }
      .equip-grid { grid-template-columns: 1fr 1fr; gap: 28px; }
    }
    @media (max-width: 640px) {
      .usos, .formatos, .equip { padding: 80px 20px; }
      .usos-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
