<!DOCTYPE html>
<!-- deploy: v3 -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Perla del Born · Eventos y Conciertos en Barcelona</title>
  <meta name="description" content="La Perla del Born: eventos privados exclusivos y conciertos de flamenco y guitarra en directo en el corazón del Born, Barcelona." />
  <link rel="icon" type="image/jpeg" href="favicon.jpg" />
  <link rel="apple-touch-icon" href="favicon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C96A;
      --gold-dark: #9A7A30;
      --black: #0A0A0A;
      --dark: #111111;
      --white: #F5F0E8;
      --white-dim: rgba(245, 240, 232, 0.7);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ── LANGUAGE BAR ── */
    .lang-bar {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-btn {
      background: none;
      border: none;
      color: var(--white-dim);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      cursor: pointer;
      padding: 4px 2px;
      transition: color 0.25s;
    }
    .lang-btn:hover, .lang-btn.active { color: var(--gold); }
    .lang-sep { color: rgba(245,240,232,0.15); font-size: 10px; }

    /* ── HEADER ── */
    .landing-header {
      display: flex;
      align-items: center;
      gap: 28px;
      max-width: 1300px;
      margin: 0 auto;
      padding: 80px 24px 40px;
    }
    .landing-logo {
      height: 170px;
      width: auto;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 20px rgba(0,0,0,0.4));
    }
    .landing-subtitle {
      font-family: var(--font-serif);
      font-size: clamp(1.3rem, 2.4vw, 2rem);
      font-weight: 300;
      font-style: italic;
      color: var(--white-dim);
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
    }
    /* Cursor del efecto máquina de escribir */
    .landing-subtitle::after {
      content: '';
      display: inline-block;
      width: 2px;
      height: 1.1em;
      margin-left: 2px;
      background: var(--gold);
      vertical-align: text-bottom;
      animation: caretBlink 0.9s step-end infinite;
    }
    .landing-subtitle.typing-done::after { opacity: 0; }
    @keyframes caretBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ── SPLIT ── */
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1300px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .split-card {
      position: relative;
      overflow: hidden;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
    }

    .split-card:hover {
      transform: translateY(-3px);
    }

    .split-img-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16/9;
      border-radius: 16px;
    }

    .split-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease, filter 0.8s ease;
      filter: brightness(0.7) saturate(1.1);
    }

    .split-card:hover .split-img-wrap img {
      transform: scale(1.05);
      filter: brightness(0.8) saturate(1.2);
    }

    .split-card.card-conciertos .split-img-wrap img {
      filter: brightness(0.85) saturate(1.3);
    }

    .split-card.card-conciertos:hover .split-img-wrap img {
      transform: scale(1.05);
      filter: brightness(0.9) saturate(1.4);
    }

    .split-img-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.7) 0%,
        rgba(0,0,0,0.15) 50%,
        transparent 100%
      );
      pointer-events: none;
    }

    .split-img-title {
      position: absolute;
      bottom: 20px;
      left: 24px;
      z-index: 2;
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 300;
      color: var(--white);
      line-height: 1.2;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    .split-content {
      padding: 20px 4px 0;
    }

    .split-label {
      display: none;
    }

    .split-title {
      display: none;
    }

    .split-text {
      font-size: 0.85rem;
      color: var(--white-dim);
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .split-btn {
      display: inline-block;
      padding: 12px 32px;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }

    .split-card:hover .split-btn {
      background: var(--gold);
      color: var(--black);
    }

    /* ── FOOTER ── */
    .landing-footer {
      text-align: center;
      padding: 40px 24px 60px;
      border-top: 1px solid rgba(201, 168, 76, 0.12);
    }
    .landing-footer p {
      font-family: var(--font-serif);
      font-size: 0.85rem;
      font-style: italic;
      color: rgba(245, 240, 232, 0.35);
    }
    .landing-footer a {
      color: var(--gold);
      text-decoration: none;
      font-style: normal;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      transition: color 0.25s;
    }
    .landing-footer a:hover { color: var(--gold-light); }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .split {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 24px 16px 60px;
      }
      .split-img-wrap {
        aspect-ratio: 16/9;
      }
      .split-content {
        padding: 16px 4px 0;
      }
      .landing-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        padding: 70px 20px 24px;
      }
      .landing-logo {
        height: 120px;
      }
      .landing-subtitle {
        white-space: normal;
        font-size: 1.2rem;
      }
    }

    /* ── ANIMATION ── */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.8s ease forwards;
    }
    .fade-in:nth-child(2) { animation-delay: 0.15s; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- LANGUAGE SELECTOR -->
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="es" onclick="setLang('es')">ES</button>
    <span class="lang-sep">·</span>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <span class="lang-sep">·</span>
    <button class="lang-btn" data-lang="ca" onclick="setLang('ca')">CA</button>
  </div>

  <!-- HEADER -->
  <header class="landing-header fade-in">
    <img src="icons/Logos%20La%20Perla/5.2%20Logo%20blanco_fondo%20transparente_La%20Perla%20del%20Born.png" alt="La Perla del Born" class="landing-logo" />
    <p class="landing-subtitle" id="landingSubtitle"></p>
  </header>

  <!-- SPLIT CARDS -->
  <main class="split">

    <!-- EVENTOS PRIVADOS -->
    <a href="privados/" class="split-card fade-in">
      <div class="split-img-wrap">
        <img src="icons/Im%C3%A1genes%20La%20Perla/Born%20Flamenco/IRUN0885.jpg" alt="Eventos privados en La Perla del Born" />
        <span class="split-img-title" id="privTitle"></span>
      </div>
      <div class="split-content">
        <p class="split-text" id="privText"></p>
        <span class="split-btn" id="privBtn"></span>
      </div>
    </a>

    <!-- ALQUILER DEL ESPACIO -->
    <a href="alquiler/" class="split-card card-conciertos fade-in">
      <div class="split-img-wrap">
        <img src="icons/Im%C3%A1genes%20La%20Perla/Local%20-%20La%20Perla/IRUN4327.jpg" alt="Alquiler del espacio en La Perla del Born" />
        <span class="split-img-title" id="concTitle"></span>
      </div>
      <div class="split-content">
        <p class="split-text" id="concText"></p>
        <span class="split-btn" id="concBtn"></span>
      </div>
    </a>

  </main>

  <!-- FOOTER -->
  <footer class="landing-footer">
    <p>Carrer dels Flassaders, 42 · El Born · Barcelona</p>
    <p style="margin-top:8px;"><a href="mailto:carol@poemasl.com">carol@poemasl.com</a> · <a href="tel:+34677321358">+34 677 321 358</a></p>
    <p style="margin-top:16px;">© 2026 La Perla del Born</p>
  </footer>

  <script>
    const t = {
      es: {
        subtitle: "Un espacio íntimo y singular en el corazón del Born de Barcelona",
        privLabel: "",
        privTitle: "Eventos Privados",
        privText: "Cierra el espacio para tu equipo o clientes. Cena, espectáculo de flamenco en vivo y una experiencia completamente privada.",
        privBtn: "Descubrir",
        concLabel: "",
        concTitle: "Alquiler del Espacio",
        concText: "Un espacio singular en el Born, a medida. Reuniones, teambuildings, conciertos, cursos, catas, presentaciones o premios: tú imaginas, nosotros lo montamos.",
        concBtn: "Descubrir",
      },
      en: {
        subtitle: "An intimate and unique venue in the heart of El Born, Barcelona",
        privLabel: "",
        privTitle: "Private Events",
        privText: "Book the entire venue for your team or clients. Dinner, live flamenco and a fully private experience.",
        privBtn: "Discover",
        concLabel: "",
        concTitle: "Venue Hire",
        concText: "A one-of-a-kind space in El Born, fully tailored. Meetings, team building, concerts, workshops, tastings, launches or award nights: you imagine it, we make it happen.",
        concBtn: "Discover",
      },
      ca: {
        subtitle: "Un espai íntim i singular al cor del Born de Barcelona",
        privLabel: "",
        privTitle: "Esdeveniments Privats",
        privText: "Tanca l'espai per al teu equip o clients. Sopar, espectacle de flamenc en directe i una experiència completament privada.",
        privBtn: "Descobrir",
        concLabel: "",
        concTitle: "Lloguer de l'Espai",
        concText: "Un espai singular al Born, a mida. Reunions, teambuildings, concerts, cursos, tastos, presentacions o premis: tu ho imagines, nosaltres ho muntem.",
        concBtn: "Descobrir",
      }
    };

    let lang = 'es';

    function setLang(l) {
      lang = l;
      document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-lang') === l);
      });
      apply();
    }

    let typeTimer = null;

    function typeSubtitle(text) {
      const el = document.getElementById('landingSubtitle');
      if (typeTimer) clearTimeout(typeTimer);
      el.classList.remove('typing-done');
      el.textContent = '';
      let i = 0;
      const step = () => {
        el.textContent = text.slice(0, i);
        if (i < text.length) {
          i++;
          typeTimer = setTimeout(step, 45);
        } else {
          el.classList.add('typing-done');
        }
      };
      step();
    }

    function apply() {
      const d = t[lang];
      typeSubtitle(d.subtitle);
      document.getElementById('privTitle').textContent = d.privTitle;
      document.getElementById('privText').textContent = d.privText;
      document.getElementById('privBtn').textContent = d.privBtn;
      document.getElementById('concTitle').textContent = d.concTitle;
      document.getElementById('concText').textContent = d.concText;
      document.getElementById('concBtn').textContent = d.concBtn;
    }

    // Detect lang from URL param
    const p = new URLSearchParams(window.location.search).get('lang');
    if (p && t[p]) { lang = p; document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-lang') === lang)); }
    apply();
  </script>
</body>
</html>
