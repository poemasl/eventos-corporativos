<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Perla del Born · Eventos Privados</title>
  <meta name="description" content="Eventos corporativos exclusivos en el corazón del Born, Barcelona. Espectáculo de flamenco en vivo, cena, cóctel y experiencias únicas para tu equipo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- LANGUAGE SELECTOR -->
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="es">ES</button>
    <span class="lang-sep">·</span>
    <button class="lang-btn" data-lang="en">EN</button>
    <span class="lang-sep">·</span>
    <button class="lang-btn" data-lang="ca">CA</button>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <img src="icons/Imágenes La Perla/Born Flamenco/IRUN0885.jpg" alt="Born Flamenco at La Perla del Born" class="hero-bg" />
    <div class="hero-content">
      <div class="hero-logo">
        <img src="icons/Logos La Perla/5.2 Logo blanco_fondo transparente_La Perla del Born.png" alt="La Perla del Born" />
      </div>
      <p class="hero-tagline" data-i18n="hero_tagline"></p>
      <a href="#contacto" class="btn-gold" data-i18n="hero_cta"></a>
    </div>
    <div class="scroll-hint">
      <span></span>
    </div>
  </section>

  <!-- INTRO -->
  <section class="intro reveal">
    <div class="container narrow">
      <p class="intro-label" data-i18n="intro_label"></p>
      <h2 class="intro-title" data-i18n="intro_title"></h2>
      <p class="intro-text" data-i18n="intro_text"></p>
    </div>
  </section>

  <!-- EL ESPACIO -->
  <section class="espacio reveal">
    <div class="container">
      <p class="section-label" data-i18n="espacio_label"></p>
      <h2 class="section-title" data-i18n="espacio_title"></h2>
      <div class="gallery">
        <div class="gallery-item large">
          <img src="icons/Imágenes La Perla/Local - La Perla/IRUN4327.jpg" alt="La Perla del Born interior" loading="lazy" />
        </div>
        <div class="gallery-item">
          <img src="icons/Imágenes La Perla/Local - La Perla/IRUN4335.jpg" alt="La Perla del Born sala" loading="lazy" />
        </div>
        <div class="gallery-item">
          <img src="icons/Imágenes La Perla/Born Flamenco/IRUN2143.jpg" alt="Espectáculo flamenco" loading="lazy" />
        </div>
        <div class="gallery-item">
          <img src="icons/Imágenes La Perla/Born Flamenco/IRUN2316.jpg" alt="Born Flamenco" loading="lazy" />
        </div>
        <div class="gallery-item">
          <img src="icons/Imágenes La Perla/Born Flamenco/IRUN2439.jpg" alt="Flamenco en vivo" loading="lazy" />
        </div>
        <div class="gallery-item">
          <img src="icons/Imágenes La Perla/Born Flamenco/IRUN3960.jpg" alt="Actuación flamenco" loading="lazy" />
        </div>
      </div>
    </div>
  </section>

  <!-- QUÉ INCLUYE -->
  <section class="incluye reveal">
    <div class="container narrow">
      <p class="section-label" data-i18n="incluye_label"></p>
      <h2 class="section-title" data-i18n="incluye_title"></h2>
      <div class="pack-grid">
        <div class="pack-item">
          <div class="pack-img-wrap">
            <img src="icons/Im%C3%A1genes%20La%20Perla/Local%20-%20La%20Perla/IRUN4327.jpg" alt="Espacio exclusivo" loading="lazy" />
          </div>
          <h3 data-i18n="pack_exclusiva_title"></h3>
          <p data-i18n="pack_exclusiva_text"></p>
        </div>
        <div class="pack-item">
          <div class="pack-img-wrap">
            <img src="icons/Im%C3%A1genes%20La%20Perla/Born%20Flamenco/IRUN0885.jpg" alt="Espectáculo flamenco" loading="lazy" />
          </div>
          <h3 data-i18n="pack_show_title"></h3>
          <p data-i18n="pack_show_text"></p>
        </div>
        <div class="pack-item">
          <div class="pack-img-wrap">
            <img src="icons/Im%C3%A1genes%20La%20Perla/Local%20-%20La%20Perla/LaPerladelBorn48.jpg" alt="Cena" loading="lazy" />
          </div>
          <h3 data-i18n="pack_cena_title"></h3>
          <p data-i18n="pack_cena_text"></p>
        </div>
        <div class="pack-item">
          <div class="pack-img-wrap">
            <img src="icons/Im%C3%A1genes%20La%20Perla/Bar%20-%20La%20Perla/LaPerladelBorn07.jpg" alt="Cóctel de bienvenida" loading="lazy" />
          </div>
          <h3 data-i18n="pack_coctel_title"></h3>
          <p data-i18n="pack_coctel_text"></p>
        </div>
        <div class="pack-item">
          <div class="pack-img-wrap">
            <img src="icons/Im%C3%A1genes%20La%20Perla/Born%20Flamenco/IRUN2316.jpg" alt="Clase de flamenco" loading="lazy" />
          </div>
          <h3 data-i18n="pack_clase_title"></h3>
          <p data-i18n="pack_clase_text"></p>
        </div>
        <div class="pack-item">
          <div class="pack-img-wrap">
            <img src="icons/Im%C3%A1genes%20La%20Perla/Bar%20-%20La%20Perla/LaPerladelBorn82.jpg" alt="Botellas especiales" loading="lazy" />
          </div>
          <h3 data-i18n="pack_botellas_title"></h3>
          <p data-i18n="pack_botellas_text"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- LOS ESPECTÁCULOS -->
  <section class="shows reveal">
    <div class="container">
      <p class="section-label" data-i18n="shows_label"></p>
      <h2 class="section-title" data-i18n="shows_title"></h2>
      <div class="shows-grid">

        <div class="show-card">
          <div class="show-img-wrap">
            <img src="icons/Imágenes La Perla/Born Flamenco/IRUN4225.jpg" alt="Born Flamenco" loading="lazy" />
          </div>
          <div class="show-info">
            <h3>Born Flamenco</h3>
            <p data-i18n="show_born_text"></p>
          </div>
        </div>

        <div class="show-card">
          <div class="show-img-wrap">
            <img src="icons/Imágenes La Perla/Barcelona Guitar Trio/Banner_BCN_GUITAR_TRIO_890x468px_H.jpg" alt="Barcelona Guitar Trio" loading="lazy" />
          </div>
          <div class="show-info">
            <h3>Barcelona Guitar Trio & Dance</h3>
            <p data-i18n="show_bgt_text"></p>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- MENÚ -->
  <section class="menu reveal">
    <div class="container narrow">
      <p class="section-label" data-i18n="menu_label"></p>
      <h2 class="section-title" data-i18n="menu_title"></h2>
      <div class="menu-cols">
        <div class="menu-col">
          <h4 class="menu-cat" data-i18n="menu_cat_aperitivos"></h4>
          <ul class="menu-list" data-i18n-list="aperitivos"></ul>
        </div>
        <div class="menu-col">
          <h4 class="menu-cat" data-i18n="menu_cat_primeros"></h4>
          <ul class="menu-list" data-i18n-list="primeros"></ul>
        </div>
        <div class="menu-col">
          <h4 class="menu-cat" data-i18n="menu_cat_segundos"></h4>
          <ul class="menu-list" data-i18n-list="segundos"></ul>
        </div>
        <div class="menu-col">
          <h4 class="menu-cat" data-i18n="menu_cat_postres"></h4>
          <ul class="menu-list" data-i18n-list="postres"></ul>
          <h4 class="menu-cat menu-cat--top" data-i18n="menu_cat_bebidas"></h4>
          <ul class="menu-list" data-i18n-list="bebidas"></ul>
        </div>
      </div>
      <p class="menu-nota" data-i18n="menu_nota"></p>
    </div>
  </section>

  <!-- GALERÍA FLAMENCO -->
  <section class="galeria-bottom reveal">
    <div class="gallery gallery--strip">
      <img src="icons/Imágenes La Perla/Born Flamenco/IRUN0894.jpg" alt="Flamenco" loading="lazy" />
      <img src="icons/Imágenes La Perla/Born Flamenco/IRUN2775.jpg" alt="Flamenco" loading="lazy" />
      <img src="icons/Imágenes La Perla/Barcelona Guitar Trio/Banner_BCN_GUITAR_TRIO_624x696px.jpg" alt="Barcelona Guitar Trio" loading="lazy" />
      <img src="icons/Imágenes La Perla/Born Flamenco/IRUN4225.jpg" alt="Flamenco" loading="lazy" />
    </div>
  </section>

  <!-- PACKS -->
  <section class="precio reveal">
    <div class="container narrow text-center">
      <p class="section-label" data-i18n="precio_label"></p>
      <h2 class="section-title" data-i18n="precio_title"></h2>
      <p class="precio-incluye" data-i18n="precio_incluye"></p>
      <p class="precio-nota" data-i18n="precio_nota"></p>
      <a href="#contacto" class="btn-gold" data-i18n="precio_cta"></a>
    </div>
  </section>

  <!-- CONTACTO -->
  <section class="contacto reveal" id="contacto">
    <div class="container narrow text-center">
      <p class="section-label" data-i18n="contacto_label"></p>
      <h2 class="section-title" data-i18n="contacto_title"></h2>
      <p class="contacto-text" data-i18n="contacto_text"></p>
      <div class="contacto-datos">
        <a href="mailto:carol@poemasl.com" class="contacto-link">carol@poemasl.com</a>
        <a href="tel:+34677321358" class="contacto-link">+34 677 321 358</a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <img src="icons/Logos La Perla/5.2 Logo blanco_fondo transparente_La Perla del Born.png" alt="La Perla del Born" class="footer-logo" />
    <p class="footer-text">El Born · Barcelona</p>
    <p class="footer-copy">© 2026 La Perla del Born</p>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
