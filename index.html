<!DOCTYPE html>
<!-- deploy: v3 -->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Perla del Born · Eventos y Conciertos en Barcelona</title>
  <meta name="description" content="La Perla del Born: eventos privados exclusivos y conciertos de flamenco y guitarra en directo en el corazón del Born, Barcelona." />
  <link rel="icon" type="image/jpeg" href="favicon.jpg" />
  <link rel="apple-touch-icon" href="favicon.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C96A;
      --gold-dark: #9A7A30;
      --black: #0A0A0A;
      --dark: #111111;
      --white: #F5F0E8;
      --white-dim: rgba(245, 240, 232, 0.7);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ── LANGUAGE BAR ── */
    .lang-bar {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lang-btn {
      background: none;
      border: none;
      color: var(--white-dim);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      cursor: pointer;
      padding: 4px 2px;
      transition: color 0.25s;
    }
    .lang-btn:hover, .lang-btn.active { color: var(--gold); }
    .lang-sep { color: rgba(245,240,232,0.15); font-size: 10px; }

    /* ── HEADER ── */
    .landing-header {
      text-align: center;
      padding: 80px 24px 40px;
    }
    .landing-logo {
      height: 140px;
      width: auto;
      margin-bottom: 28px;
      filter: drop-shadow(0 2px 20px rgba(0,0,0,0.4));
    }
    .landing-subtitle {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 300;
      font-style: italic;
      color: var(--white-dim);
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── SPLIT ── */
    .split {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .split-card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 21/9;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .split-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(201, 168, 76, 0.15);
    }

    .split-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      transition: transform 0.8s ease, filter 0.8s ease;
      filter: brightness(0.45) saturate(0.8);
    }

    .split-card:hover img {
      transform: scale(1.05);
      filter: brightness(0.55) saturate(1);
    }

    .split-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.7) 0%,
        rgba(0,0,0,0.3) 60%,
        rgba(0,0,0,0.1) 100%
      );
      pointer-events: none;
    }

    .split-content {
      position: relative;
      z-index: 2;
      padding: 32px 40px;
      display: flex;
      align-items: center;
      gap: 32px;
      width: 100%;
    }

    .split-label {
      display: none;
    }

    .split-title {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 300;
      color: var(--white);
      line-height: 1.2;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .split-text {
      font-size: 0.85rem;
      color: var(--white-dim);
      line-height: 1.7;
      max-width: 400px;
      margin: 0;
    }

    .split-btn {
      display: inline-block;
      padding: 12px 32px;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
      flex-shrink: 0;
      margin-left: auto;
    }

    .split-card:hover .split-btn {
      background: var(--gold);
      color: var(--black);
    }

    /* ── FOOTER ── */
    .landing-footer {
      text-align: center;
      padding: 40px 24px 60px;
      border-top: 1px solid rgba(201, 168, 76, 0.12);
    }
    .landing-footer p {
      font-family: var(--font-serif);
      font-size: 0.85rem;
      font-style: italic;
      color: rgba(245, 240, 232, 0.35);
    }
    .landing-footer a {
      color: var(--gold);
      text-decoration: none;
      font-style: normal;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      transition: color 0.25s;
    }
    .landing-footer a:hover { color: var(--gold-light); }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .split {
        padding: 24px 16px 60px;
        gap: 16px;
      }
      .split-card {
        aspect-ratio: 16/9;
      }
      .split-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        padding: 24px;
      }
      .split-title {
        white-space: normal;
      }
      .split-btn {
        margin-left: 0;
      }
      .landing-header {
        padding: 70px 20px 24px;
      }
    }

    /* ── ANIMATION ── */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.8s ease forwards;
    }
    .fade-in:nth-child(2) { animation-delay: 0.15s; }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- LANGUAGE SELECTOR -->
  <div class="lang-bar">
    <button class="lang-btn active" data-lang="es" onclick="setLang('es')">ES</button>
    <span class="lang-sep">·</span>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
    <span class="lang-sep">·</span>
    <button class="lang-btn" data-lang="ca" onclick="setLang('ca')">CA</button>
  </div>

  <!-- HEADER -->
  <header class="landing-header fade-in">
    <img src="icons/Logos%20La%20Perla/5.2%20Logo%20blanco_fondo%20transparente_La%20Perla%20del%20Born.png" alt="La Perla del Born" class="landing-logo" />
    <p class="landing-subtitle" id="landingSubtitle"></p>
  </header>

  <!-- SPLIT CARDS -->
  <main class="split">

    <!-- EVENTOS PRIVADOS -->
    <a href="privados/" class="split-card fade-in">
      <img src="icons/Im%C3%A1genes%20La%20Perla/Born%20Flamenco/IRUN0885.jpg" alt="Eventos privados en La Perla del Born" />
      <div class="split-content">
        <p class="split-label" id="privLabel"></p>
        <h2 class="split-title" id="privTitle"></h2>
        <p class="split-text" id="privText"></p>
        <span class="split-btn" id="privBtn"></span>
      </div>
    </a>

    <!-- CONCIERTOS PARA GRUPOS -->
    <a href="conciertos/" class="split-card fade-in">
      <img src="icons/Im%C3%A1genes%20La%20Perla/Barcelona%20Guitar%20Trio/LaPerladelBorn61.jpg" alt="Conciertos para grupos en La Perla del Born" />
      <div class="split-content">
        <p class="split-label" id="concLabel"></p>
        <h2 class="split-title" id="concTitle"></h2>
        <p class="split-text" id="concText"></p>
        <span class="split-btn" id="concBtn"></span>
      </div>
    </a>

  </main>

  <!-- FOOTER -->
  <footer class="landing-footer">
    <p>Carrer dels Flassaders, 42 · El Born · Barcelona</p>
    <p style="margin-top:8px;"><a href="mailto:carol@poemasl.com">carol@poemasl.com</a> · <a href="tel:+34677321358">+34 677 321 358</a></p>
    <p style="margin-top:16px;">© 2026 La Perla del Born</p>
  </footer>

  <script>
    const t = {
      es: {
        subtitle: "Música en directo en el corazón del Born",
        privLabel: "",
        privTitle: "Eventos Privados",
        privText: "Cierra el espacio para tu equipo o clientes. Cena, espectáculo de flamenco en vivo y una experiencia completamente privada.",
        privBtn: "Descubrir",
        concLabel: "",
        concTitle: "Conciertos para Grupos",
        concText: "Flamenco y guitarra en directo cada semana. Reserva asientos para tu grupo y ofrece una experiencia cultural única en Barcelona.",
        concBtn: "Descubrir",
      },
      en: {
        subtitle: "Live music in the heart of El Born",
        privLabel: "",
        privTitle: "Private Events",
        privText: "Book the entire venue for your team or clients. Dinner, live flamenco and a fully private experience.",
        privBtn: "Discover",
        concLabel: "",
        concTitle: "Concerts for Groups",
        concText: "Live flamenco and guitar every week. Reserve seats for your group and offer a unique cultural experience in Barcelona.",
        concBtn: "Discover",
      },
      ca: {
        subtitle: "Música en directe al cor del Born",
        privLabel: "",
        privTitle: "Esdeveniments Privats",
        privText: "Tanca l'espai per al teu equip o clients. Sopar, espectacle de flamenc en directe i una experiència completament privada.",
        privBtn: "Descobrir",
        concLabel: "",
        concTitle: "Concerts per a Grups",
        concText: "Flamenc i guitarra en directe cada setmana. Reserva seients per al teu grup i ofereix una experiència cultural única a Barcelona.",
        concBtn: "Descobrir",
      }
    };

    let lang = 'es';

    function setLang(l) {
      lang = l;
      document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-lang') === l);
      });
      apply();
    }

    function apply() {
      const d = t[lang];
      document.getElementById('landingSubtitle').textContent = d.subtitle;
      document.getElementById('privLabel').textContent = d.privLabel;
      document.getElementById('privTitle').textContent = d.privTitle;
      document.getElementById('privText').textContent = d.privText;
      document.getElementById('privBtn').textContent = d.privBtn;
      document.getElementById('concLabel').textContent = d.concLabel;
      document.getElementById('concTitle').textContent = d.concTitle;
      document.getElementById('concText').textContent = d.concText;
      document.getElementById('concBtn').textContent = d.concBtn;
    }

    // Detect lang from URL param
    const p = new URLSearchParams(window.location.search).get('lang');
    if (p && t[p]) { lang = p; document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-lang') === lang)); }
    apply();
  </script>
</body>
</html>
